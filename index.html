<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a1c">
<meta name="description" content="Poker trenér – šance na výhru, doporučené tahy a zpětná vazba.">
<title>Poker trenér</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trenér">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <label class="rec-switch" title="Doporučené tahy">
      <span class="rs-text"><b>Doporučené tahy</b><small id="recState">zapnuto</small></span>
      <input type="checkbox" id="recToggle"><i></i>
    </label>
    <button class="icon-btn" id="statsBtn" aria-label="Statistiky">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 20V10M12 20V4M19 20v-7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
    </button>
  </header>

  <section class="opps" id="opps"></section>

  <section class="table">
    <div class="felt">
      <div class="board" id="board"></div>
      <div class="pot-row"><span class="street" id="street"></span><span class="pot" id="pot"></span></div>
    </div>
  </section>

  <section class="odds" id="odds">
    <div class="odds-main">
      <div class="lbl">Šance na výhru</div>
      <div class="big" id="eqWin">–</div>
    </div>
    <div class="odds-side">
      <div class="lbl" id="madeLbl">Ruka</div>
      <div class="mid" id="made">–</div>
    </div>
    <div class="eqbar"><i id="eqBar"></i></div>
    <div class="odds-sub" id="eqSub"></div>
  </section>

  <section class="rec" id="rec" hidden>
    <div class="rec-head"><span class="dot"></span><span>Doporučeno: <b id="recAct"></b></span></div>
    <div class="rec-why" id="recWhy"></div>
  </section>

  <section class="feedback" id="feedback" hidden></section>

  <section class="actions" id="actions"></section>

  <section class="hero">
    <div class="hero-cards" id="heroCards"></div>
    <div class="hero-panel">
      <div class="lbl" id="heroPos">–</div>
      <div class="avatar me">TY</div>
      <div class="stack" id="heroStack">200</div>
      <div class="hero-last" id="heroLast"></div>
    </div>
  </section>
</div>

<!-- spodní panely -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden></div>

<script src="engine.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e)));
  }
</script>
</body>
</html>
